[package]
name = "bitosdt-gui"
version = "2.0.6"
description = "BitOSDT 2.0.6 GUI - Windows Deployment Solution"
authors = ["BitOSDT Team"]
license = "MIT"
edition = "2021"
rust-version = "1.70"

[package.metadata.bitosdt]
release_channel = "release"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
bitosdt = { path = "..", features = ["gui"] }
tauri = { version = "1.5", features = [ "window-unmaximize", "window-close", "window-maximize", "window-minimize", "window-start-dragging", "dialog-save", "dialog-open", "shell-open", "dialog"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
zip = "0.6"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tracing = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
