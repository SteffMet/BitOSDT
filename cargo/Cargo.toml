[package]
name = "bitosdt"
version = "2.0.6"
description = "BitOSDT 2.0.6 - Windows Deployment Solution"
authors = ["BitOSDT Team"]
license = "MIT"
repository = "https://github.com/bitosdt/bitosdt"
edition = "2021"
rust-version = "1.70"

[lib]
name = "bitosdt"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [], optional = true }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
dirs = "5.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
clap = { version = "4.4", features = ["derive"] }
quick-xml = { version = "0.31", features = ["serialize"] }
futures = "0.3"
md5 = "0.7"
sha2 = "0.10"
base64 = "0.21"
zip = "0.6"
tracing-appender = "0.2"

[dependencies.rusqlite]
version = "0.30"
features = ["bundled", "chrono", "uuid"]

[dev-dependencies]
tempfile = "3.8"
mockall = "0.12"
serial_test = "3.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.52"
features = [
    "Win32_System_Wmi",
    "Win32_System_Com",
    "Win32_NetworkManagement_WNet",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Foundation",
    "Win32_System_Threading",
]

[features]
default = []
gui = ["tauri", "tauri-build"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev]
debug = true
opt-level = 0
